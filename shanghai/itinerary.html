<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Itinerary · Shanghai with Mom</title>
<style>
  :root{
    --bg:#f7f2ea; --card:#ffffff; --ink:#3a332e; --muted:#9c9088; --line:#ece3d7;
    --accent:#c85a44; --accent-soft:#f6e5df;
    --l2:#4caf50; --l6:#b0338c; --l9:#ef8bb3; --l10:#5b9bd5; --l14:#8b6f4e;
    --shadow:0 2px 10px rgba(60,45,35,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Sarabun','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    line-height:1.5;display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 0 calc(40px + env(safe-area-inset-bottom))}
  #app{width:100%;max-width:440px;padding:18px 16px}
  a{color:inherit}

  header{margin:6px 2px 14px}
  .kicker{font-size:.76rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
  h1{font-size:1.4rem;font-weight:800;margin:3px 0 2px}
  .sub{color:var(--muted);font-size:.88rem}

  /* day tabs */
  .days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .dtab{flex-shrink:0;background:#fff;border:1px solid var(--line);color:var(--muted);
    padding:8px 14px;border-radius:99px;font-weight:700;font-size:.84rem;cursor:pointer}
  .dtab.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .dayhead{margin:4px 2px 14px}
  .dayhead h2{font-size:1.15rem}
  .dayhead .rt{color:var(--muted);font-size:.86rem;margin-top:2px}

  /* timeline */
  .tl{position:relative;padding-left:20px}
  .tl::before{content:'';position:absolute;left:5px;top:6px;bottom:10px;width:2px;background:var(--line)}
  .row{position:relative;margin-bottom:12px}
  .row::before{content:'';position:absolute;left:-18px;top:5px;width:11px;height:11px;border-radius:50%;
    background:var(--accent);border:3px solid var(--bg)}
  .row.metro::before{background:var(--muted)}
  .time{font-size:.8rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}

  .place{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);margin-top:3px}
  .place .p-emoji{font-size:1.05rem}
  .place .p-title{font-weight:700;font-size:1rem;margin-top:2px}
  .place .p-note{color:var(--muted);font-size:.84rem;margin-top:4px}

  /* copyable chip */
  .cp{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
    border:1px solid transparent;border-radius:9px;padding:5px 9px;margin:5px 5px 0 0;cursor:pointer;
    font-size:.82rem;font-weight:600;transition:.12s}
  .cp:active{border-color:var(--accent)}
  .cp .zh{color:var(--ink);font-weight:700}
  .cp .ic{opacity:.6;font-size:.8rem}
  .cp-list{margin-top:2px}

  /* metro block */
  .metro-box{background:#fff;border:1px solid var(--line);border-left:5px solid var(--mc,var(--muted));
    border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);margin-top:3px}
  .leg{padding:6px 0}
  .leg+.transfer{margin:6px 0}
  .linetag{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:.9rem;margin-bottom:5px}
  .ldot{width:20px;height:20px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800}
  .metro-line{display:flex;align-items:flex-start;gap:8px;font-size:.9rem;padding:2px 0}
  .metro-line .k{color:var(--muted);font-size:.8rem;min-width:66px;flex-shrink:0;font-weight:600}
  .dir{font-weight:700}
  .transfer{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.82rem;
    padding:6px 10px;border-radius:9px;display:inline-block}
  .metro-foot{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .mchip{font-size:.78rem;font-weight:700;background:#f3ece2;color:var(--ink);padding:4px 10px;border-radius:99px}
  .mchip.exit{background:#fdeee9;color:var(--accent)}

  .hint{color:var(--muted);font-size:.8rem;margin:2px 2px 12px;display:flex;gap:6px;align-items:center}

  /* legend */
  .legend{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:14px;box-shadow:var(--shadow)}
  .legend h3{font-size:.9rem;margin-bottom:8px}
  .legrow{display:flex;flex-wrap:wrap;gap:8px}
  .leg-item{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600}

  .soon{text-align:center;color:var(--muted);padding:40px 12px;font-size:.9rem}

  /* toast */
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;
    font-size:.86rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .zh{color:#ffd9cd}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="kicker">ITINERARY</div>
    <h1>Shanghai with Mom 🇨🇳</h1>
    <div class="sub">3–8 ธันวาคม 2026 · แตะชื่อสถานที่/สถานี = คัดลอกชื่อจีน ไปวางใน AMap</div>
  </header>

  <div class="days" id="days"></div>

  <div class="legend">
    <h3>🚇 สายรถไฟฟ้าที่ใช้</h3>
    <div class="legrow">
      <span class="leg-item"><span class="ldot" style="background:var(--l2)">2</span>Line 2 🟢</span>
      <span class="leg-item"><span class="ldot" style="background:var(--l6)">6</span>Line 6 🟣</span>
      <span class="leg-item"><span class="ldot" style="background:var(--l9)">9</span>Line 9 🩷</span>
      <span class="leg-item"><span class="ldot" style="background:var(--l10)">10</span>Line 10 🔵</span>
      <span class="leg-item"><span class="ldot" style="background:var(--l14)">14</span>Line 14 🟤</span>
    </div>
  </div>

  <div class="hint">💡 ต้องดู <b>ปลายทางขบวน</b> บนป้ายเสมอ (กันขึ้นผิดทิศ)</div>

  <div class="dayhead" id="dayhead"></div>
  <div class="tl" id="timeline"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const LC={2:'var(--l2)',6:'var(--l6)',9:'var(--l9)',10:'var(--l10)',14:'var(--l14)'};

// helper builders
const P=(en,zh)=>({en,zh});

const DAYS=[
 {id:'1',label:'Day 1 · 3 Dec',title:'Day 1 · ถึงเซี่ยงไฮ้ → The Bund',route:'PVG → โรงแรม → หนานจิง →外滩',
  blocks:[
   {t:'14:05',type:'place',emoji:'✈️',ti:'ถึงสนามบิน PVG (Terminal 2)',places:[P('Pudong Airport T2','浦东国际机场 2号航站楼')]},
   {t:'~15:30',type:'metro',mc:2,title:'เข้าเมือง → ไปโรงแรม (มีกระเป๋า ไม่เปลี่ยนสาย)',
    legs:[{line:2,board:P('Pudong Airport','浦东国际机场'),dir:P('East Xujing','徐泾东'),alight:P('Century Avenue','世纪大道')}],
    exit:'Exit 5',mins:'~45 นาที',walk:'เดิน ~1.7 km → โรงแรม'},
   {t:'~17:00',type:'place',emoji:'🏨',ti:'เช็คอิน + เอากระเป๋าเข้าห้อง',places:[P('Yilong Anyun Hotel','艺龙安云酒店(上海陆家嘴民生路地铁站店)')]},
   {t:'17:15',type:'walk',ti:'ออกจากโรงแรม → สถานี 民生路'},
   {t:'~17:30',type:'metro',mc:6,title:'ไปกินข้าวเย็น (ย่านหนานจิง)',
    legs:[
      {line:6,board:P('Minsheng Road','民生路'),dir:P('Oriental Sports Center','东方体育中心'),alight:P('Century Avenue','世纪大道')},
      {line:2,board:P('Century Avenue','世纪大道'),dir:P('East Xujing','徐泾东'),alight:P('East Nanjing Road','南京东路')}
    ],
    transferAt:P('Century Avenue','世纪大道')},
   {t:'~18:00',type:'eat',ti:'🍜 มื้อเย็น Local (กินก่อน ไม่เดินเล่นก่อน 😂)',
    note:'ย่าน 天津路 / 宁波路 / 浙江中路 · เลือก 1 ร้าน',
    places:[
      P("Lao Xing Long 老兴隆餐厅",'老兴隆餐厅 天津路528号'),
      P("Yang's Fried Dumpling 小杨生煎",'小杨生煎 宁波路'),
      P('Lailai Snack Dumpling 来来小吃','来来小吃 天津路504号')
    ]},
   {t:'~19:00',type:'place',emoji:'🧋',ti:'HEYTEA (หลังกินข้าว)',note:'เลือกสาขาบน 南京东路 ระหว่างทางไป Bund (ไม่ต้องเดินย้อน)',places:[P('HEYTEA','喜茶 南京东路')]},
   {t:'~19:30',type:'place',emoji:'🛍️',ti:'Nanjing Road (เดินช้อป/ถ่ายรูป)',note:'เริ่มจากฝั่ง 南京东路 → ค่อยๆ เดินไปทาง The Bund',places:[P('Nanjing Road','南京路步行街')]},
   {t:'~20:00',type:'place',emoji:'🌃',ti:'THE BUND — ถึงก่อนเปิดไฟ',note:'เดินริมน้ำ ดู 陆家嘴 skyline + 东方明珠 ตอนกลางคืน',places:[P('The Bund','外滩'),P('Oriental Pearl Tower','东方明珠')]},
   {t:'~21:30',type:'metro',mc:2,title:'กลับโรงแรม',
    legs:[
      {line:2,board:P('East Nanjing Road','南京东路'),dir:P('Pudong Airport (East)','浦东国际机场 方向'),alight:P('Century Avenue','世纪大道')},
      {line:6,board:P('Century Avenue','世纪大道'),dir:P('Gangcheng Road (North)','港城路 方向'),alight:P('Minsheng Road','民生路')}
    ],
    transferAt:P('Century Avenue','世纪大道'),walk:'เดิน ~300 m → โรงแรม'},
  ]},
 {id:'2',label:'Day 2 · 4 Dec',blocks:[]},
 {id:'3',label:'Day 3 · 5 Dec',blocks:[]},
 {id:'4',label:'Day 4 · 6 Dec',blocks:[]},
 {id:'5',label:'Day 5 · 7 Dec',blocks:[]},
 {id:'6',label:'Day 6 · 8 Dec',blocks:[]},
];

let activeDay='1';

function cpChip(p){
  return `<span class="cp" onclick="cpy(this)" data-zh="${p.zh}" data-en="${p.en}">
    ${p.en?`<span>${p.en}</span> · `:''}<span class="zh">${p.zh}</span><span class="ic">📋</span></span>`;
}

function renderDays(){
  document.getElementById('days').innerHTML=DAYS.map(d=>
    `<button class="dtab ${d.id===activeDay?'on':''}" onclick="setDay('${d.id}')">${d.label}</button>`).join('');
  const day=DAYS.find(d=>d.id===activeDay);
  document.getElementById('dayhead').innerHTML=day.title?
    `<h2>${day.title}</h2><div class="rt">${day.route||''}</div>`:'';
  const tl=document.getElementById('timeline');
  if(!day.blocks.length){tl.innerHTML='<div class="soon">🗺️ ยังไม่มีแผนวันนี้<br>ส่งแพลนมาแล้วเดี๋ยวเติมให้</div>';return;}
  tl.innerHTML=day.blocks.map(b=>{
    if(b.type==='metro')return metroBlock(b);
    if(b.type==='walk')return `<div class="row"><span class="time">${b.t||''}</span>
      <div class="place" style="padding:9px 13px"><span class="p-emoji">🚶</span> ${b.ti}</div></div>`;
    // place / eat
    const chips=(b.places||[]).map(cpChip).join('');
    return `<div class="row"><span class="time">${b.t||''}</span>
      <div class="place">
        <div class="p-title">${b.emoji?b.emoji+' ':''}${b.ti}</div>
        ${b.note?`<div class="p-note">${b.note}</div>`:''}
        ${chips?`<div class="cp-list">${chips}</div>`:''}
      </div></div>`;
  }).join('');
}

function metroBlock(b){
  const legs=b.legs.map((l,i)=>{
    const c=LC[l.line];
    const transfer=(i>0)?`<div class="transfer">🔄 เปลี่ยนสายที่ ${b.transferAt.en} ${b.transferAt.zh}</div>`:'';
    return `${transfer}<div class="leg">
      <div class="linetag"><span class="ldot" style="background:${c}">${l.line}</span> Line ${l.line}</div>
      <div class="metro-line"><span class="k">ขึ้น</span><span>${cpChip(l.board)}</span></div>
      <div class="metro-line"><span class="k">ทิศ (ปลายทางขบวน)</span><span class="dir">${l.dir.en} · ${l.dir.zh}</span></div>
      <div class="metro-line"><span class="k">ลง</span><span>${cpChip(l.alight)}</span></div>
    </div>`;
  }).join('');
  const foot=[];
  if(b.exit)foot.push(`<span class="mchip exit">🚪 ${b.exit}</span>`);
  if(b.mins)foot.push(`<span class="mchip">⏱️ ${b.mins}</span>`);
  if(b.walk)foot.push(`<span class="mchip">🚶 ${b.walk}</span>`);
  return `<div class="row metro"><span class="time">${b.t||''}</span>
    <div class="metro-box" style="--mc:${LC[b.mc]}">
      ${b.title?`<div style="font-weight:700;font-size:.92rem;margin-bottom:6px">🚇 ${b.title}</div>`:''}
      ${legs}
      ${foot.length?`<div class="metro-foot">${foot.join('')}</div>`:''}
    </div></div>`;
}

function setDay(id){activeDay=id;renderDays();window.scrollTo({top:0,behavior:'smooth'});}

function cpy(el){
  const zh=el.dataset.zh, en=el.dataset.en||'';
  const done=()=>showToast(zh);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(zh).then(done).catch(()=>fallback(zh,done));
  }else fallback(zh,done);
}
function fallback(txt,cb){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);cb();
}
let toastT;
function showToast(zh){
  const t=document.getElementById('toast');
  t.innerHTML=`คัดลอกแล้ว: <span class="zh">${zh}</span><br>ไปวางใน AMap 高德`;
  t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

renderDays();
</script>
</body>
</html>
