<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pre-Trip Checklist · Shanghai</title>
<style>
  :root{
    --bg:#f7f2ea; --card:#ffffff; --ink:#3a332e; --muted:#9c9088; --line:#ece3d7;
    --accent:#c85a44; --accent-soft:#f6e5df; --done:#5a9e6f; --done-soft:#e6f1ea;
    --shadow:0 2px 10px rgba(60,45,35,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Sarabun','Segoe UI',system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;
    display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom));
  }
  #app{width:100%;max-width:440px;padding:20px 18px}

  /* header */
  header{margin:8px 2px 20px}
  .kicker{font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
  h1{font-size:1.55rem;font-weight:800;margin:3px 0 4px}
  .sub{color:var(--muted);font-size:.92rem}

  /* progress */
  .prog-wrap{margin:18px 2px 22px}
  .prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .prog-top b{font-size:1rem}
  .prog-top .count{color:var(--muted);font-size:.86rem;font-weight:600}
  .bar{height:10px;background:#eaddcf;border-radius:99px;overflow:hidden}
  .bar>div{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),#e07d5f);transition:width .35s ease}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;transition:border-color .2s}
  .card.done{border-color:var(--done)}
  .chead{display:flex;align-items:center;gap:13px;padding:16px 16px;cursor:pointer;user-select:none}
  .cnum{font-size:.72rem;font-weight:800;color:var(--muted);width:20px;flex-shrink:0}
  .cemoji{font-size:1.5rem;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);border-radius:11px;flex-shrink:0}
  .card.done .cemoji{background:var(--done-soft)}
  .ctitle{flex:1;font-weight:700;font-size:1rem}
  .cmeta{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .badge{font-size:.72rem;font-weight:700;color:var(--muted);background:#f3ece2;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .card.done .badge{background:var(--done-soft);color:var(--done)}
  .chev{color:var(--muted);font-size:1.1rem;transition:transform .25s;line-height:1}
  .card.open .chev{transform:rotate(90deg)}

  .cbody{display:none;padding:2px 16px 16px}
  .card.open .cbody{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  /* task rows */
  .task{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-top:1px dashed var(--line);cursor:pointer}
  .task:first-child{border-top:none}
  .box{width:23px;height:23px;border:2px solid #d8cabb;border-radius:7px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:.15s;margin-top:1px}
  .box svg{width:13px;height:13px;stroke:#fff;stroke-width:3.5;fill:none;
    stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s}
  .task.on .box{background:var(--done);border-color:var(--done)}
  .task.on .box svg{opacity:1}
  .task .label{font-size:.95rem;transition:.15s}
  .task.on .label{color:var(--muted);text-decoration:line-through}

  .cta{display:inline-flex;align-items:center;gap:6px;margin:12px 0 2px;
    background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.9rem;
    padding:11px 15px;border-radius:12px;text-decoration:none;border:1px solid transparent}
  .cta:active{border-color:var(--accent)}

  /* celebrate */
  .done-banner{display:none;margin-top:6px;background:linear-gradient(135deg,#fbeee7,#f6e0d7);
    border:1px solid var(--accent);border-radius:18px;padding:22px 18px;text-align:center}
  .done-banner.show{display:block;animation:fade .3s ease}
  .done-banner .big{font-size:2.4rem}
  .done-banner h2{font-size:1.25rem;margin:6px 0 2px;color:var(--accent)}
  .done-banner p{color:var(--muted);font-size:.9rem}

  footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:22px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="kicker">PRE-TRIP CHECKLIST</div>
    <h1>Shanghai with Mom 🇨🇳</h1>
    <div class="sub">3–8 ธันวาคม 2026 · เตรียมตัวก่อนออกเดินทาง</div>
  </header>

  <div class="prog-wrap">
    <div class="prog-top"><b>ความคืบหน้า</b><span class="count" id="count">0 / 4 completed</span></div>
    <div class="bar"><div id="barfill"></div></div>
  </div>

  <div id="cards"></div>

  <div class="done-banner" id="banner">
    <div class="big">🎉</div>
    <h2>Ready for Shanghai!</h2>
    <p>เตรียมตัวครบแล้ว เดินทางปลอดภัยนะ ❤️</p>
  </div>

  <footer>ติ๊กแล้วบันทึกอัตโนมัติ · เปิดเว็บใหม่ข้อมูลยังอยู่</footer>
</div>

<script>
const CARDS=[
  {id:'c1',n:'01',emoji:'✈️',title:'เช็กอิน + เช็กที่นั่ง',
   tasks:['เช็กอินเที่ยวบิน','เช็กว่าเรากับแม่นั่งติดกัน','Screenshot Boarding Pass']},
  {id:'c2',n:'02',emoji:'🛡️',title:'ซื้อประกันเดินทาง',
   tasks:['ซื้อประกัน','เช็กความคุ้มครอง','Save กรมธรรม์']},
  {id:'c3',n:'03',emoji:'🇨🇳',title:'China Arrival Card',
   tasks:['กรอก Arrival Card'],
   action:{label:'ดูวิธีกรอก →',href:'https://www.facebook.com/bestconsortium/videos/851860230574810/',external:true}},
  {id:'c4',n:'04',emoji:'📱',title:'ซื้อ + ติดตั้ง eSIM',
   tasks:['ซื้อ China eSIM','ติดตั้ง eSIM','เช็กว่า AIS SIM ยังอยู่','เปิด AIS Wi-Fi Calling'],
   action:{label:'วิธีตั้งค่า eSIM →',href:'esim.html'}},
];

const CHECK=(t)=>`<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>`;
let state=JSON.parse(localStorage.getItem('shhChecklist')||'{}');

function render(){
  document.getElementById('cards').innerHTML=CARDS.map(c=>{
    const done=c.tasks.filter((_,i)=>state[c.id+'-'+i]).length;
    const full=done===c.tasks.length;
    const tasks=c.tasks.map((t,i)=>{
      const on=!!state[c.id+'-'+i];
      return `<div class="task ${on?'on':''}" onclick="toggle('${c.id}',${i})">
        <span class="box">${CHECK()}</span><span class="label">${t}</span></div>`;
    }).join('');
    const act=c.action?`<a class="cta" href="${c.action.href}" ${c.action.external?'target="_blank" rel="noopener"':''}>${c.action.label}</a>`:'';
    return `<div class="card ${full?'done':''}" id="card-${c.id}">
      <div class="chead" onclick="toggleCard('${c.id}')">
        <span class="cnum">${c.n}</span>
        <span class="cemoji">${c.emoji}</span>
        <span class="ctitle">${c.title}</span>
        <span class="cmeta">
          <span class="badge">${full?'✓ เสร็จ':done+'/'+c.tasks.length}</span>
          <span class="chev">›</span></span>
      </div>
      <div class="cbody">${tasks}${act}</div>
    </div>`;
  }).join('');
  updateProgress();
}
function toggleCard(id){document.getElementById('card-'+id).classList.toggle('open');}
function toggle(cid,i){
  event.stopPropagation();
  const k=cid+'-'+i;
  state[k]=!state[k];
  localStorage.setItem('shhChecklist',JSON.stringify(state));
  // update just this card + progress (keep open state)
  const wasOpen=document.getElementById('card-'+cid).classList.contains('open');
  render();
  if(wasOpen)document.getElementById('card-'+cid).classList.add('open');
}
function updateProgress(){
  const doneCards=CARDS.filter(c=>c.tasks.every((_,i)=>state[c.id+'-'+i])).length;
  document.getElementById('count').textContent=doneCards+' / '+CARDS.length+' completed';
  document.getElementById('barfill').style.width=(doneCards/CARDS.length*100)+'%';
  document.getElementById('banner').classList.toggle('show',doneCards===CARDS.length);
}
render();
</script>
</body>
</html>
