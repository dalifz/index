<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAU Mini — Y70</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#161630;
    --card:rgba(255,255,255,.05);
    --border:rgba(255,255,255,.12);
    --txt:#ffffff;
    --sub:rgba(255,255,255,.72);
    --accent:#BF00FF;   /* title + updatedAt */
    --th:#FE59C2;       /* PC Thai */
    --sea:#6F00FF;      /* PC Sea  */
    --mth:#FF3B3B;      /* M Thai  */
    --msea:#4D5BFF;     /* M Sea   */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
    font-family:-apple-system,"Segoe UI","Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding:14px;}
  .card{height:100%;background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:16px 18px 12px;display:flex;flex-direction:column;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .title{font-size:26px;font-weight:800;letter-spacing:.2px;color:var(--accent);}
  .upd{font-size:45px;font-weight:700;color:var(--accent);}
  .nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .col{background:rgba(255,255,255,.025);border-radius:13px;padding:8px 14px;
    border:1px solid var(--border);position:relative;overflow:hidden;}
  .col::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
  .col.th::before{background:var(--th);}
  .col.sea::before{background:var(--sea);}
  .col.mth::before{background:var(--mth);}
  .col.msea::before{background:var(--msea);}
  .col .name{font-size:14px;font-weight:700;letter-spacing:.3px;margin-bottom:2px;
    display:flex;align-items:center;gap:7px;}
  .col.th .name{color:var(--th);}
  .col.sea .name{color:var(--sea);}
  .col.mth .name{color:var(--mth);}
  .col.msea .name{color:var(--msea);}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .col.th .dot{background:var(--th);}
  .col.sea .dot{background:var(--sea);}
  .col.mth .dot{background:var(--mth);}
  .col.msea .dot{background:var(--msea);}
  .mtd-inline{margin-left:auto;display:flex;align-items:baseline;gap:6px;
    color:var(--txt);font-weight:700;font-size:13px;}
  .mtd-inline .lab{font-size:10px;color:var(--sub);font-weight:600;}
  .today{font-size:clamp(24px,4.4vw,50px);font-weight:800;line-height:1;letter-spacing:-1px;
    display:flex;align-items:baseline;gap:8px;white-space:nowrap;}
  .col.th .today{color:var(--th);}
  .col.sea .today{color:var(--sea);}
  .col.mth .today{color:var(--mth);}
  .col.msea .today{color:var(--msea);}
  .lab{font-size:10px;color:var(--sub);}
  .chartwrap{flex:1 1 auto;min-height:0;position:relative;margin-top:4px;}
  canvas{position:absolute;inset:0;}
  .ovbadge{position:absolute;top:4px;right:6px;z-index:2;font-size:14px;font-weight:800;
    letter-spacing:.2px;padding:4px 11px;border-radius:9px;
    background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(4px);}
  .err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--sub);font-size:12px;text-align:center;padding:20px;}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="title" id="ttl">DAU</div>
      <div class="upd" id="upd"></div>
    </div>

    <div class="nums">
      <div class="col th">
        <div class="name"><span class="dot"></span>PC Thai
          <span class="mtd-inline"><span class="lab">เฉลี่ย</span><span id="th-avg">—</span></span>
        </div>
        <div class="today"><span id="th-today">—</span></div>
      </div>
      <div class="col sea">
        <div class="name"><span class="dot"></span>PC Sea
          <span class="mtd-inline"><span class="lab">เฉลี่ย</span><span id="sea-avg">—</span></span>
        </div>
        <div class="today"><span id="sea-today">—</span></div>
      </div>
      <div class="col mth">
        <div class="name"><span class="dot"></span>M Thai
          <span class="mtd-inline"><span class="lab">เฉลี่ย</span><span id="mth-avg">—</span></span>
        </div>
        <div class="today"><span id="mth-today">—</span></div>
      </div>
      <div class="col msea">
        <div class="name"><span class="dot"></span>M Sea
          <span class="mtd-inline"><span class="lab">เฉลี่ย</span><span id="msea-avg">—</span></span>
        </div>
        <div class="today"><span id="msea-today">—</span></div>
      </div>
    </div>

    <div class="chartwrap"><div class="ovbadge" id="ovb"></div><canvas id="chart"></canvas><div class="err" id="err" style="display:none"></div></div>
  </div>

<script>
/* ===== CONFIG — DAU ===== */
const CONFIG = {
  METRIC: "DAU",
  DATA_URL: "https://script.google.com/macros/s/AKfycbzm5ABDvDdRCos_cr3zlb39KxxmNWV6Uz9RgeylYV1S3H-L7rDMQeQ6DYIu5Vojr4o/exec",
  ACCESS_KEY: "pqvCqYRiD5DlHTqpDIFfS6LyCZie",
  REFRESH_MS: 10 * 60 * 1000,
};
const C = { th:"#FE59C2", sea:"#6F00FF", mth:"#FF3B3B", msea:"#4D5BFF" };

const fmtN = n => Math.round(n).toLocaleString("en-US");
const shortDate = iso => { const p = iso.split("-"); return p[2] + "/" + p[1]; };

function lastIdx(a){ for(let i=a.length-1;i>=0;i--) if(a[i]!=null) return i; return -1; }
function avg(a){ const v=a.filter(x=>x!=null); return v.length? v.reduce((s,x)=>s+x,0)/v.length : 0; }

function trendLine(a){
  const xs=[], ys=[];
  a.forEach((v,i)=>{ if(v!=null){ xs.push(i); ys.push(v); } });
  if(xs.length<2) return a.map(()=>null);
  const n=xs.length, mx=xs.reduce((s,x)=>s+x,0)/n, my=ys.reduce((s,y)=>s+y,0)/n;
  let num=0,den=0;
  for(let i=0;i<n;i++){ num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2; }
  const slope=den?num/den:0;
  return a.map((_,i)=>my+slope*(i-mx));
}

function grad(ctx,area,rgb){
  const g=ctx.createLinearGradient(0,area.top,0,area.bottom);
  g.addColorStop(0,rgb+"2E"); g.addColorStop(1,rgb+"00"); return g;
}

function ds(label,data,col){
  return { label, data, borderColor:col, borderWidth:1.8, tension:.4, fill:true,
    spanGaps:true, pointRadius:0, pointHoverRadius:4, _glow:true,
    backgroundColor:(c)=>{const{ctx,chartArea}=c.chart;return chartArea?grad(ctx,chartArea,col):col+"22";} };
}

function overallTrend(arrs){
  const n = arrs.length ? arrs[0].length : 0, tot=[];
  for(let i=0;i<n;i++){ let s=0,any=false; arrs.forEach(a=>{ if(a[i]!=null){ s+=a[i]; any=true; } }); tot.push(any?s:null); }
  return { tot, trend:trendLine(tot) };
}
function overDataset(trend){
  return { label:"ภาพรวม 4 เซิร์ฟ", data:trend, borderColor:"#ffffff", borderWidth:3,
    borderDash:[10,5], fill:false, tension:0, pointRadius:0, yAxisID:"ov", _glow:true };
}
function overAxis(trend){
  const tv=trend.filter(v=>v!=null), lo=Math.min(...tv), hi=Math.max(...tv), pad=(hi-lo)||1;
  return { display:false, min:lo-pad*1.6, max:hi+pad*0.8 };
}
function overBadge(id,trend){
  const el=document.getElementById(id); if(!el) return;
  const tv=trend.filter(v=>v!=null);
  if(tv.length<2){ el.textContent=""; return; }
  const pc=(tv[tv.length-1]-tv[0])/Math.abs(tv[0]||1)*100, up=pc>=0;
  el.textContent=(up?"▲":"▼")+" ภาพรวม "+(up?"+":"")+pc.toFixed(1)+"%";
  el.style.color=up?"#39FF14":"#FF4D4D";
}

const glowPlugin={ id:"glow",
  beforeDatasetDraw(ch,a){ const d=ch.data.datasets[a.index]; if(d&&d._glow){ ch.ctx.save(); ch.ctx.shadowColor=d.borderColor; ch.ctx.shadowBlur=10; } },
  afterDatasetDraw(ch,a){ const d=ch.data.datasets[a.index]; if(d&&d._glow){ ch.ctx.restore(); } } };
Chart.register(glowPlugin);

let chart;
function render(d){
  const days = d.days || [];
  const P = d.products || {};
  const M = CONFIG.METRIC;
  const th   = (P["CBPC-TH"]  || {})[M] || [];
  const sea  = (P["CBPC-SEA"] || {})[M] || [];
  const mth  = (P["CBM-TH"]   || {})[M] || [];
  const msea = (P["CBM-SEA"]  || {})[M] || [];

  const li = Math.max(lastIdx(th), lastIdx(sea), lastIdx(mth), lastIdx(msea));
  const month = (days[li>=0?li:days.length-1] || "").slice(0,7);

  const idx = [];
  days.forEach((dy,i)=>{ if(dy.slice(0,7)===month) idx.push(i); });
  const L = idx.map(i=>shortDate(days[i]));
  const pick = arr => idx.map(i=> arr[i]==null?null:arr[i]);
  const thM=pick(th), seaM=pick(sea), mthM=pick(mth), mseaM=pick(msea);

  const today = a => a[lastIdx(a)] ?? 0;
  document.getElementById("th-today").textContent   = fmtN(today(thM));
  document.getElementById("sea-today").textContent  = fmtN(today(seaM));
  document.getElementById("mth-today").textContent  = fmtN(today(mthM));
  document.getElementById("msea-today").textContent = fmtN(today(mseaM));
  document.getElementById("th-avg").textContent     = fmtN(avg(thM));
  document.getElementById("sea-avg").textContent    = fmtN(avg(seaM));
  document.getElementById("mth-avg").textContent    = fmtN(avg(mthM));
  document.getElementById("msea-avg").textContent   = fmtN(avg(mseaM));
  document.getElementById("ttl").textContent        = M;

  if(d.updatedAt){
    const dt=new Date(d.updatedAt);
    dt.setDate(dt.getDate()-1);   // ⏱ เลื่อนลง 1 วัน
    document.getElementById("upd").textContent="⏱ "+dt.toLocaleString("th-TH",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
  }

  const allV=[...thM,...seaM,...mthM,...mseaM].filter(v=>v!=null);
  const maxV=allV.length?Math.max(...allV):0;
  const step=maxV>5000?1000:(maxV>500?100:10);
  const yMax=Math.ceil(maxV*1.1/step)*step;

  const OV = overallTrend([thM, seaM, mthM, mseaM]);
  overBadge("ovb", OV.trend);

  if(chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type:"line",
    data:{ labels:L, datasets:[
      ds("PC Thai", thM,   C.th),
      ds("PC Sea",  seaM,  C.sea),
      ds("M Thai",  mthM,  C.mth),
      ds("M Sea",   mseaM, C.msea),
      overDataset(OV.trend),
    ]},
    options:{
      responsive:true, maintainAspectRatio:false, animation:{duration:600},
      plugins:{
        legend:{display:false},
        tooltip:{enabled:true, callbacks:{label:c=>c.dataset.label+": "+fmtN(c.parsed.y)}}
      },
      scales:{
        x:{ grid:{display:false}, border:{display:false},
            ticks:{color:"#ffffff",font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:6} },
        y:{ grid:{color:"rgba(255,255,255,.08)"}, border:{display:false},
            beginAtZero:true, max:yMax,
            ticks:{color:"#ffffff",font:{size:10},maxTicksLimit:4,
                   callback:v=> v>=1000?(v/1000)+"k":v} },
        ov: overAxis(OV.trend)
      }
    }
  });
}

async function load(){
  try{
    const r = await fetch(CONFIG.DATA_URL + "?key=" + encodeURIComponent(CONFIG.ACCESS_KEY) + "&t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d = await r.json();
    if(!d.products) throw new Error("bad data");
    document.getElementById("err").style.display="none";
    render(d);
  }catch(e){
    const el=document.getElementById("err");
    el.style.display="flex"; el.textContent="โหลดข้อมูลไม่ได้: "+e.message;
  }
}
load();
setInterval(load, CONFIG.REFRESH_MS);

// hard reload daily at 12:00 (safety net if iframe timer is throttled)
(function dailyReload(h=12,m=0){
  const now=new Date(), next=new Date(now);
  next.setHours(h,m,0,0);
  if(next<=now) next.setDate(next.getDate()+1);
  setTimeout(()=>location.reload(), next-now);
})();
</script>
</body>
</html>
